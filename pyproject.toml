[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sashimi"
version = "0.1.0"
description = "An API-first, structured toolkit for file processing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Rio Achuzia", email = "rio@dorsalhub.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "moviepy>=2.0.0",
    "typer>=0.16.0",
    "rich>=14.0.0",
    "pymediainfo>=6.1.0",
    "ffmpeg-python>=0.2.0",
    "pillow",
    "pilmoji",
    "pydantic>=2.0.0",
    "tomlkit",# Added for your multi-tier config engine
]

[project.urls]
"Homepage" = "https://github.com/dorsalhub/sashimi"
"Repository" = "https://github.com/dorsalhub/sashimi"

[project.scripts]
sashimi = "sashimi.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sashimi"]

[tool.pytest.ini_options]
log_cli = true
log_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
line-length = 120

[tool.ruff.lint]
select = [ "E4", "E7", "E9", "F", "B" ]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]

[tool.mypy]
exclude = ["dist/", "build/", "venv/", ".venv/"]
mypy_path = "src"
warn_unreachable = true

[dependency-groups]
dev = [
    "black>=24.10.0",
    "mypy>=1.15.0",
    "pyfakefs>=5.9.2",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.4",
]

[project.scripts]
sashimi = "sashimi.cli.main:main"